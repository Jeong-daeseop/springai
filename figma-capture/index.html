<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026-08-11 화면 구성</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fb;
      color: #171e2e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 2440px; background: #f6f8fb; }
    main { width: 2440px; margin: 0 auto; padding: 48px 80px 80px; }
    header { margin-bottom: 28px; }
    h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.2; letter-spacing: -0.02em; }
    p { margin: 0; color: #596477; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 760px); gap: 40px; }
    article {
      width: 760px;
      height: 500px;
      padding: 24px 40px 28px;
      overflow: hidden;
      border: 1px solid #dfe4ec;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(20, 31, 52, .08);
    }
    h2 { margin: 0 0 24px; font-size: 18px; line-height: 1; letter-spacing: .01em; }
    img { display: block; width: 680px; height: auto; border-radius: 6px; }
  </style>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <main>
    <header>
      <h1>2026-08-11 화면 구성</h1>
      <p>시간순으로 정리한 원본 화면 6종 · 레이아웃 및 콘텐츠 검토용</p>
    </header>
    <section class="grid">
      <article><h2>09:58:15</h2><img src="assets/Q&A%20목록-01.png" alt="2026년 8월 11일 오전 9시 58분 15초 화면" /></article>
      <article><h2>09:58:36</h2><img src="assets/shot-02.png" alt="2026년 8월 11일 오전 9시 58분 36초 화면" /></article>
      <article><h2>09:59:07</h2><img src="assets/shot-03.png" alt="2026년 8월 11일 오전 9시 59분 7초 화면" /></article>
      <article><h2>09:59:40</h2><img src="assets/shot-04.png" alt="2026년 8월 11일 오전 9시 59분 40초 화면" /></article>
      <article><h2>10:00:03</h2><img src="assets/shot-05.png" alt="2026년 8월 11일 오전 10시 0분 3초 화면" /></article>
      <article><h2>10:00:22</h2><img src="assets/shot-06.png" alt="2026년 8월 11일 오전 10시 0분 22초 화면" /></article>
    </section>
  </main>
</body>
</html>
