<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>BBS 상세</title>
</head>
<section layout:fragment="content" class="egov-crud-page">
    <div class="egov-page-header">
        <h1 class="egov-page-title">BBS 상세</h1>
        <div class="egov-button-group">
            <a th:href="@{/bbs/bbsList.do(bbsId=${result.bbsId})}"
               class="krds-btn secondary medium egov-btn">목록</a>
            <a th:href="@{/bbs/bbsUpdtView.do(bbsId=${result.bbsId},nttId=${result.nttId})}"
               class="krds-btn primary medium egov-btn">수정</a>
        </div>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col egov-form-table">
            <caption>BBS 상세 정보</caption>
            <tbody>
            <tr>
                <th scope="row">게시판ID</th>
                <td th:text="${result.bbsId}"></td>
            </tr>
            <tr>
                <th scope="row">게시글번호</th>
                <td th:text="${result.nttId}"></td>
            </tr>
            <tr>
                <th scope="row">제목</th>
                <td th:text="${result.nttSj}"></td>
            </tr>
            <tr>
                <th scope="row">내용</th>
                <td th:text="${result.nttCn}"></td>
            </tr>
            <tr>
                <th scope="row">작성자명</th>
                <td th:text="${result.ntcrNm}"></td>
            </tr>
            <tr>
                <th scope="row">공지여부</th>
                <td th:text="${result.noticeAt}"></td>
            </tr>
            <tr>
                <th scope="row">첨부파일ID</th>
                <td th:text="${result.atchFileId}"></td>
            </tr>
            <tr>
                <th scope="row">최초등록시점</th>
                <td th:text="${result.frstRegistPnttm}"></td>
            </tr>
            <tr>
                <th scope="row">조회수</th>
                <td th:text="${result.rdcnt}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="egov-attachment-box">
        <div class="egov-definition-grid">
            <div class="egov-definition-label">첨부파일</div>
            <div class="egov-definition-value">
                <a th:each="file : ${fileList}"
                   th:href="@{/cmm/fms/FileDown.do(atchFileId=${file.atchFileId},fileSn=${file.fileSn})}"
                   class="egov-file-detail-link" download>
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3v12"></path>
                        <path d="m7 10 5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>
                    <span th:text="${file.originalFileName}">첨부파일 다운로드</span>
                    <span class="egov-file-id"
                          th:text="${file.fileSize != null ? file.fileSize + ' bytes' : ''}">0 bytes</span>
                </a>
                <span th:if="${#lists.isEmpty(fileList)}"
                      class="egov-file-empty">첨부파일 없음</span>
            </div>
        </div>
    </div>

    <nav class="egov-post-nav" aria-label="이전글/다음글">
        <dl class="egov-post-nav-list">
            <div class="egov-post-nav-row">
                <dt class="egov-post-nav-term">이전글</dt>
                <dd class="egov-post-nav-desc">
                    <a th:if="${prevPost != null}"
                       th:href="@{/bbs/bbsDetail.do(bbsId=${result.bbsId},nttId=${prevPost.nttId})}"
                       th:text="${prevPost.nttSj}"
                       class="egov-post-nav-link">이전글 제목</a>
                    <span th:unless="${prevPost != null}" class="egov-post-nav-empty">이전글이 없습니다.</span>
                </dd>
            </div>
            <div class="egov-post-nav-row">
                <dt class="egov-post-nav-term">다음글</dt>
                <dd class="egov-post-nav-desc">
                    <a th:if="${nextPost != null}"
                       th:href="@{/bbs/bbsDetail.do(bbsId=${result.bbsId},nttId=${nextPost.nttId})}"
                       th:text="${nextPost.nttSj}"
                       class="egov-post-nav-link">다음글 제목</a>
                    <span th:unless="${nextPost != null}" class="egov-post-nav-empty">다음글이 없습니다.</span>
                </dd>
            </div>
        </dl>
    </nav>

    <div class="egov-form-actions">
        <a th:href="@{/bbs/bbsList.do(bbsId=${result.bbsId})}"
           class="krds-btn secondary medium egov-btn">목록</a>
        <div class="egov-button-group">
            <a th:href="@{/bbs/bbsUpdtView.do(bbsId=${result.bbsId},nttId=${result.nttId})}"
               class="krds-btn primary medium egov-btn">수정</a>
            <button type="button" class="krds-btn negative medium egov-btn"
                    onclick="document.getElementById('deleteModal').showModal()">삭제</button>
        </div>
    </div>

    <dialog id="deleteModal" class="egov-modal">
        <h2 class="egov-modal-title">삭제 확인</h2>
        <p class="egov-modal-desc">삭제하시겠습니까?<br>삭제된 데이터는 복구할 수 없습니다.</p>
        <div class="egov-modal-actions">
            <button type="button" class="krds-btn secondary medium egov-btn"
                    onclick="document.getElementById('deleteModal').close()">취소</button>
            <button type="button" class="krds-btn negative medium egov-btn"
                    onclick="document.getElementById('deleteForm').submit()">삭제</button>
        </div>
    </dialog>
    <form id="deleteForm" th:action="@{/bbs/bbsDelete.do}" method="post" class="egov-hidden">
        <input th:if="${_csrf != null}" type="hidden"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:name="bbsId" th:value="${result.bbsId}"/>
        <input type="hidden" th:name="nttId" th:value="${result.nttId}"/>
    </form>
</section>
</html>
