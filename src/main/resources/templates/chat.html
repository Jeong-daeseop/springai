<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI RAG 채팅</title>
    <script src="/js/marked.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; color: #333; display: flex; height: 100vh; }
        .sidebar { width: 280px; background-color: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: white; padding: 20px; }
        .container { flex: 1; display: flex; flex-direction: column; max-width: none; margin: 0; border-radius: 0; box-shadow: none; padding: 0; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0; margin-right: 5px; }
        .tab.active { background-color: #fff; border-color: #ddd; border-bottom-color: white; margin-bottom: -1px; font-weight: bold; }
        .chat-container { height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; padding: 10px; margin-bottom: 15px; background-color: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; word-wrap: break-word; }
        .user-message { background-color: #dcf8c6; margin-left: auto; text-align: right; }
        .ai-message { background-color: #f0f0f0; }
        .input-container { display: flex; margin-top: 10px; }
        .message-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .send-button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer; font-size: 16px; }
        .send-button:hover { background-color: #45a049; }
        .send-button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .admin-panel { margin-top: 20px; padding: 15px; border: 1px solid #34495e; border-radius: 5px; background-color: #34495e; color: white; }
        .admin-panel h3 { color: #ecf0f1; margin: 0 0 15px 0; font-size: 14px; font-weight: bold; }
        .admin-button { padding: 8px 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; font-size: 12px; width: 100%; display: block; }
        .admin-button:hover { background-color: #2980b9; }
        .admin-button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        .document-status { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; font-size: 12px; }
        .document-status.processing { background-color: #f39c12; border: 1px solid #e67e22; color: white; }
        .document-status.completed { background-color: #27ae60; border: 1px solid #229954; color: white; }
        .document-status.error { background-color: #e74c3c; border: 1px solid #c0392b; color: white; }
        .progress-bar { width: 100%; height: 20px; background-color: #e9ecef; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #007bff; transition: width 0.3s ease; width: 0%; }
        .progress-text { margin-top: 5px; font-size: 12px; color: #666; }
        .model-selection { margin: 15px 0; padding: 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; display: flex; align-items: center; gap: 10px; }
        .model-selection label { font-weight: bold; color: #495057; margin: 0; }
        .model-select { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; background-color: white; font-size: 14px; min-width: 200px; }
        .model-status { font-size: 12px; color: #6c757d; }
        .model-status.success { color: #28a745; }
        .model-status.error { color: #dc3545; }
        .new-chat-btn { background-color: #3498db; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .new-chat-btn:hover { background-color: #2980b9; }
        .sessions-header { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #bdc3c7; text-transform: uppercase; letter-spacing: 0.5px; }
        .sessions-list { flex: 1; overflow-y: auto; }
        .session-item { padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; }
        .session-item:hover { background-color: #34495e; }
        .session-item.active { background-color: #3498db; border-color: #2980b9; }
        .session-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; word-wrap: break-word; line-height: 1.3; }
        .session-time { font-size: 12px; color: #95a5a6; }
        .session-item.active .session-time { color: #ecf0f1; }
        .session-actions { display: flex; gap: 8px; margin-top: 8px; opacity: 0; transition: opacity 0.2s ease; }
        .session-item:hover .session-actions, .session-item.active .session-actions { opacity: 1; }
        .session-action-btn { background: none; border: 1px solid #7f8c8d; color: #bdc3c7; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .session-action-btn:hover { background-color: #e74c3c; border-color: #c0392b; color: white; }
        .current-session-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #2c3e50; border-bottom: 1px solid #ecf0f1; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewSession()">+ 새 채팅</button>
        <div class="sessions-header">채팅 목록</div>
        <div class="sessions-list" id="sessions-list"></div>
        <div class="admin-panel">
            <h3>관리자 기능</h3>
            <button class="admin-button" id="reindex-btn" onclick="reindexDocuments()">문서 재인덱싱</button>
            <input type="file" id="upload-input" accept=".md" multiple style="display:none" onchange="handleFileSelect(event)">
            <button class="admin-button" id="upload-btn" onclick="document.getElementById('upload-input').click()">문서 업로드</button>
            <span id="upload-status" style="font-size:12px; color:#bdc3c7; margin-top:5px; display:block;"></span>
            <div class="document-status" id="document-status">
                <div id="status-text">문서 처리 상태</div>
                <div id="progress-container" style="display: none;">
                    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                    <div class="progress-text" id="progress-text">0 / 0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="current-session-title" id="current-session-title">새 채팅</div>
            <div class="tabs">
                <div class="tab active" id="rag-tab" onclick="switchTab('rag')">RAG 채팅</div>
                <div class="tab" id="simple-tab" onclick="switchTab('simple')">일반 채팅</div>
            </div>
            <div class="model-selection" id="model-selection" style="display: none;">
                <label for="model-select">사용할 모델:</label>
                <select id="model-select" class="model-select" onchange="onModelChange()">
                    <option value="">모델을 선택하세요...</option>
                </select>
                <span id="model-status" class="model-status"></span>
            </div>
            <div class="chat-container" id="chat-container">
                <div class="message ai-message">
                    <strong>Spring AI RAG 채팅에 오신 것을 환영합니다!</strong><br><br>
                    <strong>채팅 모드:</strong><br>
                    • <strong>RAG 채팅:</strong> 업로드된 문서를 기반으로 한 질의응답<br>
                    • <strong>일반 채팅:</strong> 일반적인 대화 (문서 없이도 가능)<br>
                </div>
            </div>
            <div class="input-container">
                <input type="text" class="message-input" id="message-input" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)">
                <button class="send-button" id="send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'rag';
        let statusCheckInterval = null;
        let currentSessionId = null;
        let sessions = new Map();

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function createNewSession() {
            fetch('/api/chat/sessions', { method: 'POST' })
                .then(r => r.json())
                .then(session => {
                    sessions.set(session.sessionId, session);
                    switchToSession(session.sessionId);
                    refreshSessionsList();
                }).catch(e => console.error('세션 생성 실패:', e));
        }

        function switchToSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('currentSessionId', sessionId);
            const session = sessions.get(sessionId);
            if (session) document.getElementById('current-session-title').textContent = session.title;
            loadSessionMessages(sessionId);
            updateSessionListUI();
        }

        function loadSessionMessages(sessionId) {
            const container = document.getElementById('chat-container');
            container.innerHTML = '<div class="message ai-message"><strong>Spring AI RAG 채팅에 오신 것을 환영합니다!</strong></div>';
            fetch(`/api/chat/sessions/${sessionId}/messages`)
                .then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(messages => {
                    messages.forEach(m => {
                        if (m.content && m.content.trim()) addMessage(m.content, m.messageType === 'USER');
                    });
                }).catch(e => console.error('메시지 로드 실패:', e));
        }

        function updateSessionListUI() {
            const list = document.getElementById('sessions-list');
            list.innerHTML = '';
            const sorted = Array.from(sessions.values()).sort((a, b) =>
                new Date(b.lastMessageAt) - new Date(a.lastMessageAt));

            if (sorted.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#95a5a6;font-size:14px;margin-top:20px;">아직 채팅이 없습니다.</div>';
                return;
            }

            sorted.forEach(session => {
                const div = document.createElement('div');
                div.classList.add('session-item');
                if (session.sessionId === currentSessionId) div.classList.add('active');

                const diff = Math.floor((new Date() - new Date(session.lastMessageAt)) / 3600000);
                const timeText = diff < 1 ? '방금 전' : diff < 24 ? `${diff}시간 전` : `${Math.floor(diff/24)}일 전`;

                div.innerHTML = `
                    <div class="session-title">${session.title}</div>
                    <div class="session-time">${timeText}</div>
                    <div class="session-actions">
                        <button class="session-action-btn" onclick="deleteSession('${session.sessionId}', event)">삭제</button>
                    </div>`;
                div.onclick = e => { if (!e.target.classList.contains('session-action-btn')) switchToSession(session.sessionId); };
                list.appendChild(div);
            });
        }

        function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (!confirm('이 채팅을 삭제하시겠습니까?')) return;
            fetch(`/api/chat/sessions/${sessionId}`, { method: 'DELETE' })
                .then(r => {
                    if (r.ok) {
                        sessions.delete(sessionId);
                        if (currentSessionId === sessionId) {
                            sessions.size > 0
                                ? switchToSession(Array.from(sessions.values()).sort((a,b) => new Date(b.lastMessageAt)-new Date(a.lastMessageAt))[0].sessionId)
                                : createNewSession();
                        } else updateSessionListUI();
                    }
                }).catch(e => console.error('세션 삭제 실패:', e));
        }

        function refreshSessionsList() {
            return fetch('/api/chat/sessions')
                .then(r => r.json())
                .then(list => {
                    sessions.clear();
                    list.forEach(s => sessions.set(s.sessionId, s));
                    updateSessionListUI();
                    return list;
                });
        }

        function initializeSessionManagement() {
            const savedId = localStorage.getItem('currentSessionId');
            refreshSessionsList().then(() => {
                if (savedId && sessions.has(savedId)) {
                    switchToSession(savedId);
                } else if (sessions.size > 0) {
                    const latest = Array.from(sessions.values()).sort((a,b) => new Date(b.lastMessageAt)-new Date(a.lastMessageAt))[0];
                    switchToSession(latest.sessionId);
                } else {
                    createNewSession();
                }
            }).catch(() => createNewSession());
        }

        function loadOllamaModels() {
            const sel = document.getElementById('model-selection');
            const modelSelect = document.getElementById('model-select');
            const status = document.getElementById('model-status');
            status.textContent = '모델 목록 로딩 중...';
            fetch('/api/ollama/models')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.available) {
                        modelSelect.innerHTML = '<option value="">모델을 선택하세요...</option>';
                        (data.models || []).forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m; opt.textContent = m;
                            modelSelect.appendChild(opt);
                        });
                        if (data.defaultModel && (data.models||[]).includes(data.defaultModel)) {
                            modelSelect.value = data.defaultModel;
                        }
                        sel.style.display = 'flex';
                        status.textContent = `${(data.models||[]).length}개 모델 발견`;
                        status.className = 'model-status success';
                    } else {
                        sel.style.display = 'flex';
                        modelSelect.innerHTML = '<option value="">Ollama 사용 불가</option>';
                        modelSelect.disabled = true;
                        status.textContent = data.message || 'Ollama 사용 불가';
                        status.className = 'model-status error';
                    }
                }).catch(e => { console.error('모델 로드 오류:', e); });
        }

        function onModelChange() {
            const m = document.getElementById('model-select').value;
            const status = document.getElementById('model-status');
            status.textContent = m ? `선택: ${m}` : '기본 모델 사용';
            status.className = 'model-status ' + (m ? 'success' : 'warning');
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('rag-tab').classList.remove('active');
            document.getElementById('simple-tab').classList.remove('active');
            document.getElementById(mode + '-tab').classList.add('active');
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function addMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.classList.add('message', isUser ? 'user-message' : 'ai-message');
            if (isUser) {
                div.textContent = text;
            } else {
                try { div.innerHTML = marked.parse(text); }
                catch(e) { div.innerHTML = `<pre style="white-space:pre-wrap;font-family:inherit;margin:0;">${escapeHtml(text)}</pre>`; }
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            const sendBtn = document.getElementById('send-btn');
            if (!message) return;

            sendBtn.disabled = true;
            addMessage(message, true);
            input.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.classList.add('message', 'ai-message');
            aiDiv.textContent = '...';
            document.getElementById('chat-container').appendChild(aiDiv);

            const endpoint = currentMode === 'rag' ? '/ai/rag/stream' : '/ai/simple/stream';
            const params = new URLSearchParams({ message });
            const selectedModel = document.getElementById('model-select').value;
            if (selectedModel) params.append('model', selectedModel);
            if (currentSessionId) params.append('sessionId', currentSessionId);

            const eventSource = new EventSource(`${endpoint}?${params}`);
            let fullResponse = '';

            eventSource.onmessage = e => {
                if (e.data) {
                    fullResponse += e.data;
                    try { aiDiv.innerHTML = marked.parse(fullResponse); }
                    catch(err) { aiDiv.innerText = fullResponse; }
                    document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
                }
            };

            eventSource.onerror = () => {
                eventSource.close();
                if (!fullResponse) aiDiv.innerHTML = '<div style="color:#e74c3c;font-style:italic;">응답 생성 중 오류가 발생했습니다.</div>';
                sendBtn.disabled = false;
                if (fullResponse) refreshSessionsList();
            };

            eventSource.addEventListener('complete', () => {
                eventSource.close();
                sendBtn.disabled = false;
                refreshSessionsList();
            });
        }

        function reindexDocuments() {
            const btn = document.getElementById('reindex-btn');
            const statusDiv = document.getElementById('document-status');
            const statusText = document.getElementById('status-text');
            btn.disabled = true; btn.textContent = '처리 중...';
            statusDiv.className = 'document-status processing';
            statusDiv.style.display = 'block';
            statusText.textContent = '문서 재인덱싱을 시작합니다...';
            if (statusCheckInterval) clearInterval(statusCheckInterval);

            fetch('/api/documents/reindex', { method: 'POST' })
                .then(r => { if (r.ok) startStatusCheck(); else throw new Error('요청 실패'); })
                .catch(e => {
                    statusDiv.className = 'document-status error';
                    statusText.textContent = '재인덱싱 요청 중 오류가 발생했습니다.';
                    btn.disabled = false; btn.textContent = '문서 재인덱싱';
                });
        }

        function startStatusCheck() {
            statusCheckInterval = setInterval(() => {
                fetch('/api/documents/status').then(r => r.json()).then(data => {
                    const statusDiv = document.getElementById('document-status');
                    const statusText = document.getElementById('status-text');
                    const progressContainer = document.getElementById('progress-container');
                    const progressFill = document.getElementById('progress-fill');
                    const progressText = document.getElementById('progress-text');
                    const btn = document.getElementById('reindex-btn');
                    if (data.processing) {
                        statusDiv.className = 'document-status processing';
                        statusText.textContent = '문서를 처리하고 있습니다...';
                        progressContainer.style.display = 'block';
                        const pct = data.totalCount > 0 ? (data.processedCount / data.totalCount) * 100 : 0;
                        progressFill.style.width = pct + '%';
                        progressText.textContent = `${data.processedCount} / ${data.totalCount}`;
                    } else {
                        clearInterval(statusCheckInterval);
                        statusDiv.className = 'document-status completed';
                        statusText.textContent = `재인덱싱 완료: ${data.processedCount}개 청크 처리됨`;
                        progressContainer.style.display = 'none';
                        btn.disabled = false; btn.textContent = '문서 재인덱싱';
                        setTimeout(() => statusDiv.style.display = 'none', 5000);
                    }
                }).catch(() => {
                    clearInterval(statusCheckInterval);
                    document.getElementById('reindex-btn').disabled = false;
                    document.getElementById('reindex-btn').textContent = '문서 재인덱싱';
                });
            }, 1000);
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            const status = document.getElementById('upload-status');
            const btn = document.getElementById('upload-btn');
            if (!files || files.length === 0) return;
            if (files.length > 5) { status.textContent = '최대 5개 파일만 업로드할 수 있습니다.'; status.style.color = 'red'; return; }
            let totalSize = 0;
            for (let f of files) {
                if (!f.name.endsWith('.md')) { status.textContent = '마크다운(.md) 파일만 업로드 가능합니다.'; status.style.color = 'red'; return; }
                if (f.size > 5 * 1024 * 1024) { status.textContent = '파일당 최대 5MB까지만 업로드할 수 있습니다.'; status.style.color = 'red'; return; }
                totalSize += f.size;
            }
            if (totalSize > 20 * 1024 * 1024) { status.textContent = '총 20MB를 초과할 수 없습니다.'; status.style.color = 'red'; return; }
            const formData = new FormData();
            for (let f of files) formData.append('files', f);
            status.textContent = '업로드 중...'; status.style.color = '#555'; btn.disabled = true;
            fetch('/api/documents/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    status.textContent = data.success ? `업로드 성공! (${data.uploaded}개)` : '업로드 실패: ' + (data.message || '오류');
                    status.style.color = data.success ? 'green' : 'red';
                    btn.disabled = false;
                }).catch(() => { status.textContent = '업로드 중 오류 발생'; status.style.color = 'red'; btn.disabled = false; });
            event.target.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOllamaModels();
            initializeSessionManagement();
            fetch('/api/documents/status').then(r => r.json()).then(data => {
                if (data.processing) startStatusCheck();
            }).catch(() => {});
        });
    </script>
</body>
</html>
