spring:
  application:
    name: springai-mcp
  profiles:
    default: dev
  thymeleaf:
    suffix: .html
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mvc:
    async:
      request-timeout: ${APP_SSE_TOTAL_TIMEOUT:5m}
  main:
    banner-mode: off
    web-application-type: servlet   # SSE HTTP 서버 활성화
    allow-bean-definition-overriding: true  # Ollama(chat) + Transformers(embedding) 빈 공존
  lifecycle:
    # SIGTERM 수신 시 진행 중인 HTTP 요청을 정리한 뒤 ApplicationContext를 닫는다.
    timeout-per-shutdown-phase: ${APP_SHUTDOWN_TIMEOUT:30s}
  ai:
    mcp:
      server:
        name: springai-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        annotation-scanner:
          enabled: false
      streamable-http:
        keep-alive-interval: 30s
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: ${APP_OPENAI_TOTAL_TIMEOUT:2m}
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 4096          # 코드 생성 응답 길이 대응
    model:
      embedding: transformers       # ko-sroberta-multitask ONNX 로컬 임베딩 사용

    embedding:
      transformer:
        onnx:
          modelUri: file:${ONNX_MODEL_PATH:${user.home}/models/ko-sroberta/model.onnx}
          modelOutputName: last_hidden_state  # torch.onnx.export 출력명
        tokenizer:
          uri: file:${ONNX_TOKENIZER_PATH:${user.home}/models/ko-sroberta/tokenizer.json}
          options:
            padding: true
            truncation: true
            maxLength: 512
            returnTensor: true

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3:8b}
        num-predict: 2048         # 최대 생성 토큰 수
        num-ctx: 8192             # 컨텍스트 윈도우 — ChatMemory(8) + RAG + Schema 합산 수용
        temperature: 0.0          # 소스 생성 일관성 — 완전 결정적 출력
      # embedding 블록 제거 — ONNX Transformers로 대체
    vectorstore:
      redis:
        uri: ${REDIS_URI:redis://localhost:6379}
        index: ${REDIS_INDEX:egov-rag}
        prefix: ${REDIS_PREFIX:egov:}
        initialize-schema: true    # VectorStoreConfig.initializeSchema(true)와 일치
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      keepalive-time: 60000       # Mac 슬립 후 재연결 속도 향상
      connection-timeout: ${APP_MYSQL_CONNECT_TIMEOUT_MS:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
  jdbc:
    template:
      query-timeout: ${APP_MYSQL_QUERY_TIMEOUT:30s}
  data:
    redis:
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${APP_REDIS_READ_TIMEOUT:5s}
  # ARCH-WP3: 기존에 데이터가 있는 DB는 V1을 실제 실행하지 않고 baseline으로만 기록하고,
  # 완전히 새 DB는 V1을 그대로 실행해 10개 AI_* 테이블을 만든다. migration 실패 시
  # 기본적으로 기동이 실패한다(ARCH-0304) — 별도 구현 불필요.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Flyway 도입 이전 기존 AI_* 테이블"
    validate-on-migrate: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  # 운영 기본 포트는 MCP 클라이언트 설정과 동일하게 8080으로 고정한다.
  # 테스트/격리 실행에서만 SERVER_PORT로 명시적으로 변경한다.
  port: ${SERVER_PORT:8080}
  # Tomcat Connector를 즉시 끊지 않고 graceful shutdown 순서로 종료한다.
  shutdown: graceful
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:PT1H}        # SSE 연결 유지 — 기본 1시간
    max-http-form-post-size: ${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:2MB}   # MR-A08: Refinement Patch Set 등 JSON 본문 크기 상한
    max-swallow-size: ${SERVER_TOMCAT_MAX_SWALLOW_SIZE:2MB}

rag:
  similarity:
    threshold: 0.30       # pdfplumber 변환 기준 적정값
  top-k: 10              # 검색 범위 확대
  enable-query-compression: true
  compression:
    model: qwen3:1.7b     # 쿼리 압축 전용 경량 모델 (항상 Ollama 로컬 처리)

chat:
  memory:
    max-messages: 8       # 20 → 8: 토큰 예산 확보 (num-ctx 8192 기준)

app:
  # 5축 파이프라인은 신규 Apply(V2_APPLY)를 기본 활성화한다. 장애·롤백 시
  # APP_PIPELINE_EVOLUTION_MODE=V2_PREVIEW 또는 DUAL_READ를 명시해 단계적으로 낮출 수 있다.
  pipeline-evolution:
    mode: ${APP_PIPELINE_EVOLUTION_MODE:V2_APPLY}
    # 이 값 미만의 필수 시각 추론은 자동 승인하지 않는다.
    auto-approval-confidence-threshold: ${APP_PIPELINE_AUTO_APPROVAL_CONFIDENCE_THRESHOLD:0.85}
    # 이 값 미만은 원본 Evidence가 있어도 증거 품질 부족으로 Apply를 차단한다.
    evidence-confidence-threshold: ${APP_PIPELINE_EVIDENCE_CONFIDENCE_THRESHOLD:0.60}
  # CRUD_명시적_승인_단계_구현_명세서.md §4 옵션 B. 기본값(빈 목록·false)에서는 기존 동작과
  # 완전히 동일하다 — 운영 중 특정 테이블을 여기 추가해야만 승인 게이트가 켜진다.
  crud-generation:
    approval-required-tables: []
    approval-required-for-all: false
  # R5-004: 명시적으로 켠 경우에만 기본 다운로드가 Catalog+Registry v3 SSOT를 요구한다.
  figma-ssot-bundle-enabled: ${APP_FIGMA_SSOT_BUNDLE_ENABLED:false}
  templates:
    # 운영 중 교체가 필요한 템플릿만 이 절대 경로에서 우선 탐색한다. 비어 있으면 jar classpath만 사용한다.
    external-directory: ${EXTERNAL_TEMPLATE_DIRECTORY:}
  resilience:
    circuit-breaker:
      failure-threshold: ${APP_CIRCUIT_FAILURE_THRESHOLD:5}
      open-duration: ${APP_CIRCUIT_OPEN_DURATION:30s}
    bulkhead:
      capture-concurrency: ${APP_CAPTURE_CONCURRENCY:4}
      indexing-concurrency: ${APP_INDEXING_CONCURRENCY:2}
      chat-concurrency: ${APP_CHAT_CONCURRENCY:8}
    timeout:
      mysql-connect: ${APP_MYSQL_CONNECT_TIMEOUT:30s}
      redis-connect: ${APP_REDIS_CONNECT_TIMEOUT:3s}
      redis-read: ${APP_REDIS_READ_TIMEOUT:5s}
      openai-connect: ${APP_OPENAI_CONNECT_TIMEOUT:5s}
      openai-first-token: ${APP_OPENAI_FIRST_TOKEN_TIMEOUT:30s}
      openai-idle: ${APP_OPENAI_IDLE_TIMEOUT:45s}
      ollama-connect: ${APP_OLLAMA_CONNECT_TIMEOUT:3s}
      ollama-first-token: ${APP_OLLAMA_FIRST_TOKEN_TIMEOUT:60s}
      ollama-idle: ${APP_OLLAMA_IDLE_TIMEOUT:60s}
      figma-connect: ${APP_FIGMA_CONNECT_TIMEOUT:5s}
      figma-total: ${APP_FIGMA_TOTAL_TIMEOUT:30s}
      extractor-connect: ${APP_EXTRACTOR_CONNECT_TIMEOUT:3s}
      extractor-total: ${APP_EXTRACTOR_TOTAL_TIMEOUT:60s}
      sse-total: ${APP_SSE_TOTAL_TIMEOUT:5m}
  db:
    # ARCH-0310: Flyway(V1)가 이제 이 10개 테이블을 만든다. 이 flag는 default true로 기존
    # @PostConstruct DDL을 그대로 유지해 이중 안전망 역할을 하며, 전체 환경에서 Flyway만으로
    # 충분함을 확인한 뒤(ARCH-0311) false로 내리고 최종적으로 DDL 코드 자체를 제거한다.
    legacy-repository-ddl-enabled: ${LEGACY_REPOSITORY_DDL_ENABLED:true}
  mcp:
    # ARCH-WP1: 공통 MCP Tool 인증. 비어 있으면 모든 Tool 호출이 fail-closed 된다.
    shared-token: ${MCP_SHARED_TOKEN:}
    # 회전 직후 짧은 유예기간에만 이전 token을 허용한다. valid-until은 UTC ISO-8601 형식이다.
    previous-shared-token: ${MCP_PREVIOUS_SHARED_TOKEN:}
    previous-token-valid-until: ${MCP_PREVIOUS_TOKEN_VALID_UNTIL:}
    # AUDIT_ONLY | COMPATIBILITY(공통 또는 기존 Tool secret) | REQUIRED(기본, deny-by-default)
    auth-mode: ${MCP_AUTH_MODE:REQUIRED}
    # COMPATIBILITY 모드는 이 UTC 시각 전까지만 레거시 Tool 인자 secret을 허용한다.
    legacy-credential-valid-until: ${MCP_LEGACY_CREDENTIAL_VALID_UNTIL:}
  thymeleaf:
    browser-gate:
      # WP8 브라우저 Gate의 승인 baseline·렌더 scratch 보관 루트. 대상 프로젝트 경로 hash로
      # 다시 격리되므로 여러 프로젝트가 이 루트 하나를 공유해도 서로 섞이지 않는다.
      baseline-root: ${THYMELEAF_BASELINE_ROOT:${java.io.tmpdir}/springai-thymeleaf-baselines}
  figma:
    # /mcp/** 전역 permitAll과 별도로 신규 Figma/DesignSystem Tool 메서드 내부에서 검증한다.
    mcp-shared-secret: ${FIGMA_MCP_SHARED_SECRET:}
    # R6-012: DEC-10=REST에서 Plugin이 장기 X-API-Key 대신 쓸 단기 토큰. 비어 있으면 발급 비활성화.
    rest-token-secret: ${FIGMA_REST_TOKEN_SECRET:}
    rest-token-ttl-seconds: ${FIGMA_REST_TOKEN_TTL_SECONDS:900}
    # 비어 있으면(기본값) CORS를 전혀 허용하지 않는다. Figma Plugin UI origin을 알게 되면 채운다.
    rest-allowed-origins: ${FIGMA_REST_ALLOWED_ORIGINS:}
  web-capture:
    enabled: ${WEB_CAPTURE_ENABLED:false}
    extractor-base-url: ${WEB_CAPTURE_EXTRACTOR_BASE_URL:http://127.0.0.1:4319}
    extractor-api-key: ${WEB_CAPTURE_EXTRACTOR_API_KEY:}
    document-key-secret: ${WEB_CAPTURE_DOCUMENT_KEY_SECRET:}
    connect-timeout-seconds: ${WEB_CAPTURE_CONNECT_TIMEOUT_SECONDS:3}
    response-timeout-seconds: ${WEB_CAPTURE_RESPONSE_TIMEOUT_SECONDS:60}
    max-response-mb: ${WEB_CAPTURE_MAX_RESPONSE_MB:50}
    max-uncompressed-artifact-mb: ${WEB_CAPTURE_MAX_UNCOMPRESSED_ARTIFACT_MB:100}
    artifact-base-path: ${WEB_CAPTURE_ARTIFACT_PATH:${java.io.tmpdir}/springai-design-artifacts}
    retention-hours: ${WEB_CAPTURE_RETENTION_HOURS:24}
    mapper-version: ${WEB_CAPTURE_MAPPER_VERSION:rendered-design-mapper-v2}
    enabled-profiles:
      - LOCAL_WEB
    allowed-origins:
      - http://127.0.0.1:8080
      - http://localhost:8080
    allowed-resource-origins: []
    sensitive-selectors:
      - input[type=password]
  artifact-store:
    root-path: ${ARTIFACT_STORE_ROOT_PATH:${java.io.tmpdir}/springai-artifact-store}
    max-artifact-size-bytes: ${ARTIFACT_STORE_MAX_SIZE_BYTES:104857600}
    allowed-media-types:
      - application/json
      - text/html
      - text/plain
      - application/zip
      - image/png
      - image/jpeg
  design-vision:
    # 공공기관 망분리·외부 전송 정책 승인 전에는 비활성 상태를 유지합니다.
    provider: ${DESIGN_VISION_PROVIDER:openai} # disabled | openai | ollama
    openai-model: ${DESIGN_VISION_OPENAI_MODEL:gpt-4o-mini}
    ollama-model: ${DESIGN_VISION_OLLAMA_MODEL:qwen2.5vl:7b}
    prompt-version: v1
    max-file-mb: 20
    max-pdf-pages: 30
    max-images-per-request: 8
    render-dpi: 180
    max-image-dimension: 2048
    timeout-seconds: 120
    max-attempts: 2
    allowed-paths:
      - ${user.dir}
      - ${user.home}/Desktop
      - ${user.home}/workspace-egov
      - ${java.io.tmpdir}
    figma:
      # 외부 SaaS 사용 승인 전에는 반드시 false를 유지합니다.
      enabled: ${DESIGN_VISION_FIGMA_ENABLED:false}
      access-token: ${FIGMA_ACCESS_TOKEN:}
      allowed-file-types:
        - file
        - design
      allowed-file-keys: ${FIGMA_ALLOWED_FILE_KEYS:}
      # 2-A2: Allowlist 검증. 비어 있으면 모든 파일 허용 (개발용).
      # 운영: 쉼표로 구분된 fileKey 목록 (예: "key1,key2,key3")
      allowed-node-ids: ${FIGMA_ALLOWED_NODE_IDS:}
      # Node 소속 검증 캐시 TTL (초). 0 = 비활성화
      node-ownership-cache-ttl-seconds: ${FIGMA_NODE_OWNERSHIP_CACHE_TTL:300}
      depth-limit: ${FIGMA_DEPTH_LIMIT:4}
      connect-timeout-seconds: ${FIGMA_CONNECT_TIMEOUT_SECONDS:5}
      response-timeout-seconds: ${FIGMA_RESPONSE_TIMEOUT_SECONDS:30}
      max-response-mb: ${FIGMA_MAX_RESPONSE_MB:10}
      max-attempts: ${FIGMA_MAX_ATTEMPTS:3}
      retry-max-delay-seconds: ${FIGMA_RETRY_MAX_DELAY_SECONDS:15}
      mapper-version: ${FIGMA_MAPPER_VERSION:figma-mapper-v2}
  sql:
    dialect: mysql_mariadb
  api-key: ${APP_API_KEY}
  document-paths:
    - /Users/EGOVEDU/eGovFrame-5.0.0/md
    - /Users/EGOVEDU/eGovFrame-5.0.0/docs
    - /Users/jeongdaeseob/workspace-spring-ai/springai/docs
  # document-paths 폴더 반복 자동 스캔(인제스트). 기본 비활성 — 켜려면 true로 설정
  document-auto-scan-enabled: ${DOCUMENT_AUTO_SCAN_ENABLED:false}
  document-auto-scan-interval-ms: ${DOCUMENT_AUTO_SCAN_INTERVAL_MS:1800000}
  document-cleanup-max-orphan-ratio: ${DOCUMENT_CLEANUP_MAX_ORPHAN_RATIO:0.5}
  # documentProcessingExecutor 큐 용량(기본 50)보다 충분히 작게 — 대용량 폴더에서 RejectedExecutionException 방지
  document-scan-batch-size: ${DOCUMENT_SCAN_BATCH_SIZE:20}

egov:
  output:
    base-path: ${EGOV_OUTPUT_PATH:${user.home}/workspace-egov/egov-generated}
    allowed-paths:
      - ${user.home}/workspace-egov/egov-boot-web
  validation:
    # pom.xml/build.gradle은 플러그인 코드를 실행할 수 있으므로 운영자 승인 전 비활성화합니다.
    allow-build-execution: ${EGOV_ALLOW_BUILD_EXECUTION:false}
    build-timeout-seconds: 180
    max-output-chars: 20000

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,externalDependencies
  health:
    defaults:
      enabled: true
