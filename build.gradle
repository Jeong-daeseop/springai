plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0-RC1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.krdevops'
version = '0.0.1-SNAPSHOT'
description = 'springai'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0-RC1")
}

def isMacOs = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')
def macOsArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nettyMacClassifier = (macOsArch.contains('aarch64') || macOsArch.contains('arm64')) ? 'osx-aarch_64' : 'osx-x86_64'

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-model-transformers'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-redis'
    implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.freemarker:freemarker:2.3.33'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.networknt:json-schema-validator:3.0.1'
    runtimeOnly 'com.mysql:mysql-connector-j'
    if (isMacOs) {
        runtimeOnly "io.netty:netty-resolver-dns-native-macos::${nettyMacClassifier}"
    }
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Xmx2g'
}

// CI의 기본 러너에는 로컬 전용 ONNX 임베딩 모델(약 400MB)이 없다.
// 전체 테스트는 개발 환경에서 그대로 실행하고, 원격 CI에서는 모델·DB·Redis에
// 의존하지 않는 빠른 회귀 세트만 선택한다. 통합 테스트는 별도 환경에서 ./gradlew test로 실행한다.
if (providers.gradleProperty('ci').isPresent()) {
    tasks.named('test') {
        exclude '**/SpringaiApplicationTests.class'
        exclude '**/config/FigmaMcpRegistrationTest.class'
        exclude '**/config/McpToolDefinitionSnapshotTest.class'
        exclude '**/mapper/*IntegrationTest.class'
        exclude '**/service/*IntegrationTest.class'
        exclude '**/service/BoardTemplateRendererTest.class'
        exclude '**/service/CrudTemplateRendererTest.class'
        exclude '**/service/MasterDetailTemplateRendererTest.class'
    }
}

tasks.register('figmaContractTest', Exec) {
    group = 'verification'
    description = 'Semantic Figma JSON Schema와 계약 fixture를 검증합니다.'
    workingDir file('website-figma-contract')
    commandLine 'npm', 'test'
}

tasks.named('check') {
    dependsOn tasks.named('figmaContractTest')
}

tasks.named('bootJar') {
    enabled = true
}

tasks.named('jar') {
    enabled = false
}

tasks.named('processResources') {
    from('website-figma-contract') {
        include '*.schema.json'
        into 'contracts'
    }
}
