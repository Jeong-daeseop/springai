plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0-RC1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.krdevops'
version = '0.0.1-SNAPSHOT'
description = 'springai'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0-RC1")
}

def isMacOs = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')
def macOsArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nettyMacClassifier = (macOsArch.contains('aarch64') || macOsArch.contains('arm64')) ? 'osx-aarch_64' : 'osx-x86_64'

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-model-transformers'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-redis'
    implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.freemarker:freemarker:2.3.33'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.networknt:json-schema-validator:3.0.1'
    implementation 'com.github.javaparser:javaparser-core:3.26.4'
    runtimeOnly 'com.mysql:mysql-connector-j'
    if (isMacOs) {
        runtimeOnly "io.netty:netty-resolver-dns-native-macos::${nettyMacClassifier}"
    }
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Xmx2g'
}

// CI의 기본 러너에는 로컬 전용 ONNX 임베딩 모델(약 400MB)이 없다.
// 전체 테스트는 개발 환경에서 그대로 실행하고, 원격 CI에서는 모델·DB·Redis에
// 의존하지 않는 빠른 회귀 세트만 선택한다. 통합 테스트는 별도 환경에서 ./gradlew test로 실행한다.
if (providers.gradleProperty('ci').isPresent()) {
    tasks.named('test') {
        exclude '**/SpringaiApplicationTests.class'
        exclude '**/config/FigmaMcpRegistrationTest.class'
        exclude '**/config/McpToolDefinitionSnapshotTest.class'
        exclude '**/config/FlywayMigrationIntegrationTest.class'
        exclude '**/mapper/**/*IntegrationTest.class'
        exclude '**/service/**/*IntegrationTest.class'
        exclude '**/service/BoardTemplateRendererTest.class'
        exclude '**/service/CrudTemplateRendererTest.class'
        exclude '**/service/MasterDetailTemplateRendererTest.class'
    }
}

tasks.register('figmaContractTest', Exec) {
    group = 'verification'
    description = 'Semantic Figma JSON Schema와 계약 fixture를 검증합니다.'
    workingDir file('website-figma-contract')
    commandLine 'npm', 'test'
}

tasks.register('qnaRuntimeResolverTest', Test) {
    group = 'verification'
    description = 'Q&A 6개 계약을 DB에 적재하고 Runtime Resolver Bundle을 생성합니다.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/KrdsQnaRuntimeResolverIntegrationTest.class'
}

tasks.register('figmaRuntimeBundlePluginTest', Exec) {
    group = 'verification'
    description = 'Runtime Resolver가 생성한 Q&A 6개 Bundle을 Figma Plugin Preview로 검증합니다.'
    dependsOn tasks.named('qnaRuntimeResolverTest')
    workingDir file('figma-screen-spec-plugin')
    commandLine 'npm', 'run', 'test:runtime-bundles'
}

tasks.register('browserGateTest', Exec) {
    group = 'verification'
    description = 'WP8 Playwright 1440/768/390, axe, visual diff Gate를 실제 Chromium으로 검증합니다.'
    workingDir file('jsp-design-extractor')
    commandLine 'npm', 'run', 'test:browser-gate'
}

tasks.register('prodBootJarSmoke', Exec) {
    group = 'verification'
    description = '소스 디렉터리 밖에서 prod bootJar의 Thymeleaf와 정적 리소스를 검증합니다.'
    dependsOn tasks.named('bootJar')
    commandLine 'node', 'scripts/prod-bootjar-smoke.mjs'
}

tasks.named('check') {
    dependsOn tasks.named('figmaContractTest')
}

tasks.named('bootJar') {
    enabled = true
}

tasks.named('jar') {
    enabled = false
}

tasks.named('processResources') {
    from('website-figma-contract') {
        include '*.schema.json'
        into 'contracts'
    }
    from('website-figma-contract') {
        include 'screen-patterns-v1.json'
        into 'figma/contracts'
    }
    from('website-figma-contract/fixtures/qna') {
        include 'krds-component-registry-v2.json'
        include 'variant-rule-set-krds-v2-candidate.json'
        into 'figma/contracts/qna'
    }
    from('website-figma-contract/fixtures/qna/v2') {
        include '*.json'
        into 'figma/contracts/qna/v2'
    }
}
