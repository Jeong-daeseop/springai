name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jsp-design-extractor/package-lock.json

      - name: Install browser Gate dependencies
        working-directory: jsp-design-extractor
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: jsp-design-extractor
        run: npx playwright install --with-deps chromium

      - name: Test WP8 browser Gate
        working-directory: jsp-design-extractor
        run: npm run test:browser-gate

      - name: Test and build
        run: ./gradlew clean test bootJar -Pci --stacktrace

      - name: Test WP9 prod bootJar from isolated working directory
        run: ./gradlew prodBootJarSmoke -Pci --stacktrace

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-diagnostics
          if-no-files-found: warn
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/problems/**
