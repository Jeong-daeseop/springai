<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  ============================================================
  FTC 스타일 FOOTER 프래그먼트
  egov-boot-web 적용 경로:
    src/main/resources/templates/layout/footer.html
  ============================================================
-->
<body>
<footer th:fragment="footer"
        style="background:#f4f5f6;border-top:1px solid #e8eaec;font-family:'Pretendard GOV Variable',-apple-system,sans-serif;">

  <div style="max-width:1200px;margin:0 auto;padding:32px 24px 0;">

    <!-- 기관 정보 + 링크 -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:24px;gap:24px;flex-wrap:wrap;">

      <!-- 기관 정보 -->
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <span style="width:40px;height:40px;background:#083891;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;">
            <span style="width:16px;height:16px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;">
              <span style="width:7px;height:7px;background:#256ef4;border-radius:50%;"></span>
            </span>
          </span>
          <span style="font-size:16px;font-weight:700;color:#1e2124;">공정거래위원회</span>
        </div>
        <p style="margin:0 0 5px;font-size:13px;color:#464c53;">
          (30108) 세종특별자치시 다솜2로 94
        </p>
        <p style="margin:0 0 5px;font-size:13px;color:#464c53;">
          <strong>정부민원안내콜센터</strong> 국번없이 <strong>110</strong> (무료)
        </p>
        <p style="margin:0;font-size:13px;color:#464c53;">
          <strong>대표 상담안내</strong> <strong>1670-0007</strong>
          <span style="color:#8a949e;font-size:12px;">(유료, 월~금 9:00~18:00)</span>
        </p>
      </div>

      <!-- 패밀리 사이트 -->
      <div style="min-width:180px;">
        <label style="font-size:12px;font-weight:600;color:#6d7882;display:block;margin-bottom:6px;">패밀리 사이트</label>
        <div style="position:relative;">
          <select id="familySite"
                  style="width:100%;padding:8px 32px 8px 12px;border:1px solid #cdd1d5;border-radius:4px;font-size:13px;color:#464c53;background:#fff;font-family:inherit;appearance:none;cursor:pointer;">
            <option value="">관련 기관 선택</option>
            <option value="https://www.ftc.go.kr">공정거래위원회</option>
            <option value="https://www.kftc.or.kr">금융결제원</option>
            <option value="https://www.kca.go.kr">한국소비자원</option>
          </select>
          <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;"
               width="10" height="6" viewBox="0 0 10 6" fill="none">
            <path d="M1 1l4 4 4-4" stroke="#8a949e" stroke-width="1.5"/>
          </svg>
        </div>
        <script>
          document.getElementById('familySite').addEventListener('change', function() {
            if (this.value) { window.open(this.value, '_blank'); this.value = ''; }
          });
        </script>
      </div>

    </div>
  </div>

  <!-- 하단 copyright 바 -->
  <div style="border-top:1px solid #e0e2e4;">
    <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:48px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <a th:href="@{/policy/privacy}"
         style="font-size:13px;color:#256ef4;font-weight:600;text-decoration:none;">개인정보처리방침</a>
      <a th:href="@{/policy/copyright}"
         style="font-size:13px;color:#464c53;text-decoration:none;">저작권 정책</a>
      <a th:href="@{/accessibility}"
         style="font-size:13px;color:#464c53;text-decoration:none;">웹 접근성</a>
      <a th:href="@{/sitemap}"
         style="font-size:13px;color:#464c53;text-decoration:none;">사이트맵</a>
      <span style="margin-left:auto;font-size:12px;color:#8a949e;">
        © Fair Trade Commission. All rights reserved.
      </span>
    </div>
  </div>

</footer>
</body>
</html>
